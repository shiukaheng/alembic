name: Build & Test Wheels (cibuildwheel)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: cibw · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-14 ]
        exclude:
          - os: macos-14 # TODO: Right now MacOS is broken. Lets try to fix it later.

    steps:
      - uses: actions/checkout@v4

      # Python used to drive cibuildwheel itself (not the wheel’s Python tag)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel==2.18.1

      # ---------- Windows: compile deps via vcpkg ----------
      - name: Build C++ deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install --no-progress ninja
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install boost-python imath:x64-windows
          # expose the toolchain to CMake during wheel build
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $Env:GITHUB_ENV

      # ---------- Build wheels & smoke-test ----------
      - name: Build wheels
        env:
          # Build *only* cp311 wheels
          CIBW_BUILD: "cp311-*"

          # CMake flags every platform needs
          CIBW_ENVIRONMENT: >
            CMAKE_ARGS="-DUSE_PYALEMBIC=On -DPYALEMBIC_PYTHON_MAJOR=3"

          # Hooks that run inside the build env
          CIBW_BEFORE_BUILD_MACOS: bash .ci/build_deps_macos.sh
          CIBW_BEFORE_BUILD_LINUX: bash .ci/build_deps_linux.sh

          # Simple import test
          CIBW_TEST_COMMAND: |
            python - <<'PY'
            import alembic, sys
            print("wheel OK for", sys.platform, alembic.__version__)
            PY
        run: cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
