name: Build & Test Wheels (cibuildwheel)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: cibw • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]   # add macos-13 if you still need Intel-only

    steps:
      - uses: actions/checkout@v4

      # ---------- standard Python ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------- cibuildwheel itself ----------
      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel==2.18.1

      # ---------- per-OS dependency hooks ----------
      # macOS: build Boost-Python & Imath from source (matches wheel's Python)
      - name: Build C++ deps (macOS)
        if: matrix.os == 'macos-14'
        run: bash .ci/build_deps_macos.sh

      # Linux: dev packages + build matching Boost-Python & Imath
      - name: Build C++ deps (manylinux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl tar \
                                  libboost-all-dev            # header-only Boost
          # Build Boost-Python + PyImath for CPython 3.11 (same logic as macOS)
          bash .ci/build_deps_macos.sh       # works unchanged inside manylinux

      # Windows: use vcpkg to compile Boost-Python & Imath for CPython 3.11
      - name: Build C++ deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install --no-progress ninja
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install boost-python imath[python]:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $Env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $Env:GITHUB_ENV

      # ---------- wheel build & smoke-test ----------
      - name: Build wheels
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ENVIRONMENT: >
            CMAKE_ARGS="-DUSE_PYALEMBIC=On -DPYALEMBIC_PYTHON_MAJOR=3"
          CIBW_TEST_COMMAND: "python - <<'PY'\nimport alembic, imath, sys; print('wheel OK:', alembic.__version__)\nPY"
          CIBW_TEST_SKIP: "*-macosx_arm64"       # drop this line after you’re happy with arm64
        run: cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
